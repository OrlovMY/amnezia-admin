name: release

on:
  push:
    tags:
      - "v*"
  # Намеренно нет workflow_dispatch: ручной запуск на ветке собрал бы релиз
  # не из тега, а происхождение тега (ниже) на этот случай не рассчитано.

permissions:
  contents: read

# На Windows-раннере shell по умолчанию — pwsh, где `test`, `${VAR:0:7}`,
# `export` не работают; все run: ниже написаны для bash.
defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          # A6: те же три пары, что в job build ниже и в job checks файла
          # ci.yml. До A6 здесь было две ОС (без macos) — и эта матрица не
          # сверялась ни с чем. Теперь её стережёт
          # internal/ciguard (TestReleaseTestMatrixMatchesBuild): расхождение
          # трёх списков краснеет, а не обнаруживается на теге.
          - os: linux
            runner: ubuntu-24.04
          - os: windows
            runner: windows-2025
          - os: macos
            runner: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # A6 (ревью SEC-01): токен не остаётся в .git/config — иначе его
          # читает любой следующий шаг, включая сборку сторонних модулей.
          persist-credentials: false

      # README actions/checkout на закреплённом SHA (см. ссылку у "Происхождение
      # тега" ниже) гарантирует только "fetch all history for all branches and
      # tags" при fetch-depth: 0 — не гарантирует, что при checkout тега
      # появится именно локальная remote-tracking ссылка refs/remotes/origin/main.
      # Решение ядра (SEC-01, 15.09 13:45, ответ на PARK-вопрос): голое
      # `git fetch origin main` тоже не годится — оно обновляет origin/main
      # только при подходящем remote.origin.fetch, то есть снова зависит от
      # конфигурации checkout. Явный refspec создаёт ссылку независимо от
      # конфигурации; вторая строка — внятный отказ вместо загадочной ошибки
      # merge-base, если она всё же не появилась.
      - name: Гарантировать origin/main для merge-base
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git rev-parse --verify -q origin/main >/dev/null || { echo "СТОП: нет origin/main после fetch" >&2; exit 1; }

      - name: Происхождение тега
        # Дословно повторяется в test/build/release (композитный action не
        # заводим ради четырёх строк — лишний непинованный файл сложнее, чем
        # копия). Требование "тег — предок origin/main" и семвер — решения
        # ядра 15.09 (п.2, п.3); origin/main — https://github.com/actions/checkout/blob/34e114876b0b11c390a56381ad16ebd13914f8d5/README.md#L7
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = tag
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$GITHUB_REF_NAME^{commit}")"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "СТОП: тег $GITHUB_REF_NAME не на origin/main — сначала push main, затем Re-run; тег не пересоздавать" >&2; exit 1; }
          printf '%s\n' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$' || { echo "СТОП: тег не semver" >&2; exit 1; }
          git tag -l | awk -v t="$GITHUB_REF_NAME" '$0 != t' | bash scripts/check-version-growth.sh "$GITHUB_REF_NAME"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Linux GUI deps
        # go vet ./... ниже разбирает и cmd/gui (Fyne/glfw/GL) — без этих
        # заголовков он не соберёт даже типы.
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev
          gcc --version

      - name: Windows mingw (gcc для CGO GUI-сборки и -race)
        # windows-2025 содержит MSYS2/mingw-w64, но не добавляет его в PATH —
        # https://github.com/actions/runner-images/blob/main/images/windows/Windows2025-VS2026-Readme.md
        # ("MSYS2 is pre-installed on image but not added to PATH").
        # Ниже нет глушителя кода возврата: отсутствие gcc обязано ронять job (св. 3).
        if: matrix.os == 'windows'
        run: |
          printf '%s\n' 'C:\msys64\mingw64\bin' >> "$GITHUB_PATH"
          export PATH="/c/msys64/mingw64/bin:$PATH"
          gcc --version

      # Шага actionlint здесь больше нет (A6). Он был слабым: без shellcheck,
      # только release.yml, под `if: matrix.os == 'linux'`. Проверку несёт
      # ci.yml, job lint: оба workflow, пиновый shellcheck, канарейка — на
      # каждом PR, то есть ДО тега. Смысл того вызова (оба файла, без
      # отключённых правил) стережёт internal/ciguard.

      - name: go vet
        run: go vet ./...

      - name: go test -race
        # Список пакетов ОБЯЗАН совпадать со списком в ci.yml (job checks) —
        # это стережёт internal/ciguard (TestGoTestPackagesMatch). ./cmd/gui/
        # добавлен в A6: до этого тесты GUI (сторож утечки секретов, прибор
        # осмотра) на релизной сборке не выполнялись вовсе. cgo и библиотеки
        # Fyne дают шаги «Linux GUI deps» и «Windows mingw» выше.
        run: go test -race -count=1 ./core/ ./internal/... ./cmd/cli/ ./cmd/gui/

  build:
    name: build (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Закреплённые метки на 15.09.2026 — https://github.com/actions/runner-images#available-images
          # (то, на что сейчас резолвятся *-latest); архитектура macOS-метки
          # macos-26 — arm64 (см. Image Definitions macos-26-arm64-Readme.md).
          - os: linux
            runner: ubuntu-24.04
            arch: amd64
          - os: windows
            runner: windows-2025
            arch: amd64
          - os: macos
            runner: macos-26
            arch: arm64
    steps:
      - name: Архитектура раннера против matrix.arch
        # A6, следствие A5 № 1. internal/ciguard сверяет matrix.arch с
        # таблицей в коде — две наши записи, ни одна не измерение. Здесь
        # единственное измерение: RUNNER_ARCH ставит сам раннер. Если GitHub
        # сменит архитектуру образа под меткой, job упадёт здесь, а не
        # соберёт релиз под ложным описанием.
        #
        # Три исхода, а не два: неизвестное или пустое RUNNER_ARCH — СТОП, а
        # не «совпало». Шаг стоит первым и без `if:` — сверять нечего только
        # тогда, когда нечего собирать.
        env:
          DECLARED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          case "${RUNNER_ARCH:-}" in
            X64) actual=amd64 ;;
            ARM64) actual=arm64 ;;
            "") echo "СТОП: RUNNER_ARCH пуста — раннер не предъявил архитектуру, сверять не с чем" >&2; exit 1 ;;
            *) echo "СТОП: RUNNER_ARCH=$RUNNER_ARCH — значение, которого этот шаг не знает; сверять не с чем" >&2; exit 1 ;;
          esac
          test -n "${DECLARED_ARCH:-}" || { echo "СТОП: matrix.arch пуст — объявления нет, сверять не с чем" >&2; exit 1; }
          test "$actual" = "$DECLARED_ARCH" || { echo "СТОП: раннер измерен как $RUNNER_ARCH ($actual), а matrix.arch объявляет $DECLARED_ARCH — поле arch и таблица runnerArch в internal/ciguard устарели" >&2; exit 1; }
          echo "архитектура раннера: $RUNNER_ARCH = matrix.arch $DECLARED_ARCH"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # A6 (ревью SEC-01): токен не остаётся в .git/config — иначе его
          # читает любой следующий шаг, включая сборку сторонних модулей.
          persist-credentials: false

      - name: Гарантировать origin/main для merge-base
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git rev-parse --verify -q origin/main >/dev/null || { echo "СТОП: нет origin/main после fetch" >&2; exit 1; }

      - name: Происхождение тега
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = tag
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$GITHUB_REF_NAME^{commit}")"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "СТОП: тег $GITHUB_REF_NAME не на origin/main — сначала push main, затем Re-run; тег не пересоздавать" >&2; exit 1; }
          printf '%s\n' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$' || { echo "СТОП: тег не semver" >&2; exit 1; }
          git tag -l | awk -v t="$GITHUB_REF_NAME" '$0 != t' | bash scripts/check-version-growth.sh "$GITHUB_REF_NAME"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Версия образа раннера
        # Закреплённая метка фиксирует ОС, но не версию образа — образ
        # обновляется еженедельно (П6); ImageOS/ImageVersion — стандартные
        # переменные окружения хостед-раннеров GitHub.
        # HR-D 16.09 (run 35053112015, build/macos): раньше шаг стоял ДО
        # setup-go, чтобы показать исходный (не пиновый) тулчейн образа —
        # но macos-26 не имеет предустановленного go (в отличие от
        # ubuntu-24.04/windows-2025), поэтому `go version` там падал
        # "command not found" ДО того, как setup-go вообще успевал его
        # поставить. Перенесено ПОСЛЕ setup-go: теперь показывает версию
        # go, которая реально используется для сборки (пиновую, из
        # go.mod), и работает одинаково на всех трёх ОС матрицы.
        # ImageOS/ImageVersion от порядка не зависят — печатаются как были.
        run: |
          echo "$ImageOS $ImageVersion"
          go version

      - name: Linux GUI deps
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev
          gcc --version

      - name: Windows mingw (gcc для CGO GUI-сборки)
        if: matrix.os == 'windows'
        run: |
          printf '%s\n' 'C:\msys64\mingw64\bin' >> "$GITHUB_PATH"
          export PATH="/c/msys64/mingw64/bin:$PATH"
          gcc --version

      - name: Сборка
        run: bash scripts/build-release.sh ${{ matrix.os }}
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}

      - name: Проверка версии — CLI (точное равенство)
        # Таблица «бинарь → метод» на каждую ОС матрицы (задание BUILD-MATRIX,
        # Г3). Два метода, и второй — узкое исключение, а не новый порядок:
        #   run   — раннер этой job исполняет бинарь: запуск + посимвольное
        #           сравнение вывода. Все три нативные цели остаются на нём.
        #   norun — кросс-собранная цель, которую раннер физически исполнить
        #           не может: linux/arm64 на ubuntu-24.04 (amd64) даёт
        #           "exec format error", а darwin/amd64 на macos-26 (arm64)
        #           запустится лишь при наличии Rosetta 2, которого образ
        #           раннера не гарантирует. Такая цель проверяется четырьмя
        #           признаками ниже — через `go version -m` и `grep -aF`,
        #           без `file` (его наличия на раннере никто не обещает).
        # Перевод любой существующей цели с run на norun — решение ядра, а не
        # правка на месте. После прохода таблица сверяется с фактическим
        # содержимым dist/: два независимых списка одного множества расходятся
        # молча, и расхождение обнаруживает не CI, а пользователь.
        run: |
          set -euo pipefail
          case "${{ matrix.os }}" in
            linux)
              table=("amnezia-admin-linux-amd64|run||" "amnezia-admin-linux-arm64|norun|linux|arm64")
              ;;
            windows)
              table=("amnezia-admin-windows-amd64.exe|run||")
              ;;
            macos)
              table=("amnezia-admin-macos-arm64|run||" "amnezia-admin-macos-amd64|norun|darwin|amd64")
              ;;
          esac
          expected="amnezia-admin $GITHUB_REF_NAME (${GITHUB_SHA:0:7})"
          covered=""
          for row in "${table[@]}"; do
            IFS='|' read -r name method goos goarch <<< "$row"
            bin="dist/$name"
            covered="$covered $name"
            test -f "$bin" || { echo "СТОП: нет ожидаемого CLI-бинаря $bin" >&2; exit 1; }
            if [ "$method" = run ]; then
              out="$("./$bin" version)"
              test "$out" = "$expected" || { echo "СТОП: версия CLI '$out' != '$expected' ($name)" >&2; exit 1; }
              continue
            fi
            # Признак 1 — тег в теле бинаря.
            grep -aF -- "$GITHUB_REF_NAME" "$bin" >/dev/null || { echo "СТОП: признак 1 — тег $GITHUB_REF_NAME не найден в теле $name" >&2; exit 1; }
            # Признак 2 — полный коммит в теле бинаря: без него -X ...Commit
            # потерян и бинарь печатает "(unknown)", чего не заметила бы ни
            # одна другая проверка.
            grep -aF -- "$GITHUB_SHA" "$bin" >/dev/null || { echo "СТОП: признак 2 — коммит $GITHUB_SHA не найден в теле $name (-X Commit потерян)" >&2; exit 1; }
            # Признак 3 — -trimpath=true и "(devel)": тег пришёл от нашего -X,
            # а не от авто-vcs-стемпинга Go (то же обоснование, что у GUI).
            info="$(go version -m "$bin")"
            printf '%s\n' "$info" | grep -qE 'build[[:space:]]+-trimpath=true' || { echo "СТОП: признак 3 — -trimpath=true не подтверждён в $name" >&2; exit 1; }
            printf '%s\n' "$info" | grep -qE 'mod[[:space:]]+amnezia-admin[[:space:]]+\(devel\)' || { echo "СТОП: признак 3 — версия в $name могла прийти из авто-vcs-стемпинга Go, а не из -X (нет 'mod amnezia-admin (devel)')" >&2; exit 1; }
            # Признак 4 — точное равенство ожидаемой паре GOOS/GOARCH, а не
            # поиск подстроки по имени файла.
            printf '%s\n' "$info" | grep -qE "build[[:space:]]+GOOS=${goos}\$" || { echo "СТОП: признак 4 — в $name нет GOOS=$goos" >&2; exit 1; }
            printf '%s\n' "$info" | grep -qE "build[[:space:]]+GOARCH=${goarch}\$" || { echo "СТОП: признак 4 — в $name нет GOARCH=$goarch" >&2; exit 1; }
            # Признак 5 (ревью, Low-2) — это действительно CLI, а не GUI:
            # признаки 1–4 одинаково зелены на GUI-бинаре, положенном под
            # именем кросс-цели (тег, коммит, -trimpath, (devel) и пара
            # GOOS/GOARCH у него те же). Главный пакет их различает.
            printf '%s\n' "$info" | grep -qE 'path[[:space:]]+amnezia-admin/cmd/cli' || { echo "СТОП: признак 5 — $name собран не из ./cmd/cli (нет 'path amnezia-admin/cmd/cli')" >&2; exit 1; }
          done
          shopt -s nullglob
          for p in dist/amnezia-admin-*; do
            f="${p#dist/}"
            case "$f" in
              amnezia-admin-gui-*) continue ;;
            esac
            case " $covered " in
              *" $f "*) ;;
              *) echo "СТОП: CLI-бинарь $f не покрыт проверкой версии" >&2; exit 1 ;;
            esac
          done

      - name: Проверка версии — GUI
        # HR-D 15.09 12:20: runtime/debug.BuildSettings пишет закрытый список
        # ключей (-trimpath, vcs.*, ...) — произвольные -X там никогда не
        # появляются, `go version -m` НЕ показывает встроенную -ldflags -X
        # версию. GUI не печатает версию в stdout (нет дисплея в CI) — версия
        # проверяется как буквальная строка внутри бинаря (она используется в
        # заголовке окна и в тексте экрана подключения, cmd/gui/main.go, и не
        # вырезается -s -w — это данные программы, не отладочные символы).
        #
        # SEC-01 (ревью round1, Medium): один только grep по строке версии —
        # ложный PASS. С Go 1.24+ `go build` САМ вшивает в buildinfo версию
        # модуля из git-тега на HEAD, даже без -ldflags -X — при регрессии
        # "-X не передан" grep всё равно нашёл бы тег (взятый Go из git, а не
        # из нашего -X), а сам бинарь при этом печатал бы "dev (unknown)".
        # scripts/build-release.sh теперь собирает с -buildvcs=false — тогда
        # при отсутствии -X модуль в buildinfo помечен "(devel)" без версии;
        # проверка ниже требует ОБА признака: строка тега в теле бинаря И
        # "mod amnezia-admin (devel)" в go version -m (доказывает, что тег
        # пришёл не от авто-vcs-стемпинга Go, а от нашего -X). Происхождение
        # коммита не теряется — он отдельно вшит -X Commit и виден в
        # аттестации SHA256SUMS.
        run: |
          set -euo pipefail
          case "${{ matrix.os }}" in
            linux) bin="dist/amnezia-admin-gui-linux-amd64" ;;
            windows) bin="dist/amnezia-admin-gui-windows-amd64.exe" ;;
            macos) bin="dist/amnezia-admin-gui-macos-arm64" ;;
          esac
          grep -aF -- "$GITHUB_REF_NAME" "$bin" >/dev/null || { echo "СТОП: версия $GITHUB_REF_NAME не найдена в теле $bin" >&2; exit 1; }
          go version -m "$bin" | grep -qE 'build[[:space:]]+-trimpath=true' || { echo "СТОП: -trimpath=true не подтверждён в $bin" >&2; exit 1; }
          go version -m "$bin" | grep -qE 'mod[[:space:]]+amnezia-admin[[:space:]]+\(devel\)' || { echo "СТОП: версия в $bin могла прийти из авто-vcs-стемпинга Go, а не из -X (нет 'mod amnezia-admin (devel)')" >&2; exit 1; }
          # Сторож покрытия — симметрично CLI-шагу (ревью, Low-1). Сейчас
          # GUI-цель на job ровно одна, и case выше её покрывает; но стоит
          # позже добавить GUI-цель и забыть строку case — бинарь уехал бы в
          # релиз непроверенным, и ни одна проверка бы не покраснела.
          covered="${bin#dist/}"
          shopt -s nullglob
          for p in dist/amnezia-admin-gui-*; do
            f="${p#dist/}"
            case " $covered " in
              *" $f "*) ;;
              *) echo "СТОП: GUI-бинарь $f не покрыт проверкой версии" >&2; exit 1 ;;
            esac
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.os }}
          path: dist/*

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      # Множество субъектов аттестации — ОДНО место, откуда его берут и шаг
      # «Субъекты аттестации» (проверяет), и attest-build-provenance
      # (подписывает). До A6 SHA256SUMS не входил: глоб amnezia-admin-* его
      # не берёт по имени. Файл, по которому сверяют загрузки, уходил без
      # подписи — подменивший бинари подменил бы и его. Глоб не расширен:
      # вторая строка называет ровно один файл.
      ATTEST_SUBJECTS: |-
        dist/amnezia-admin-*
        dist/SHA256SUMS
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # A6: у этого job право contents: write. Без этой строки токен
          # остаётся в .git/config рабочего каталога и доступен любому шагу.
          # Публикация берёт токен своим входом, а не из git-конфигурации;
          # git fetch ниже идёт по публичному репозиторию.
          persist-credentials: false

      - name: Гарантировать origin/main для merge-base
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git rev-parse --verify -q origin/main >/dev/null || { echo "СТОП: нет origin/main после fetch" >&2; exit 1; }

      - name: Происхождение тега
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = tag
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$GITHUB_REF_NAME^{commit}")"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "СТОП: тег $GITHUB_REF_NAME не на origin/main — сначала push main, затем Re-run; тег не пересоздавать" >&2; exit 1; }
          printf '%s\n' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$' || { echo "СТОП: тег не semver" >&2; exit 1; }
          git tag -l | awk -v t="$GITHUB_REF_NAME" '$0 != t' | bash scripts/check-version-growth.sh "$GITHUB_REF_NAME"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: Проверка состава релиза
        # SC2012/SC2010 (actionlint-раннер): парсинг вывода ls заменён на
        # bash-глобы (shopt -s nullglob — пустой каталог даёт count=0, а не
        # литеральную "*"); поведение то же самое (те же сообщения, тот же
        # регистронезависимый поиск подстроки fakeserver/fakesrv).
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          files=(*)
          count="${#files[@]}"
          test "$count" -eq 8 || { echo "СТОП: ожидалось 8 файлов в dist/, найдено $count" >&2; ls -la >&2; exit 1; }
          for f in amnezia-admin-linux-amd64 amnezia-admin-linux-arm64 amnezia-admin-windows-amd64.exe amnezia-admin-macos-amd64 amnezia-admin-macos-arm64 amnezia-admin-gui-linux-amd64 amnezia-admin-gui-windows-amd64.exe amnezia-admin-gui-macos-arm64; do
            test -f "$f" || { echo "СТОП: отсутствует ожидаемый файл $f" >&2; exit 1; }
          done
          shopt -s nocaseglob
          fake=(*fakeserver* *fakesrv*)
          shopt -u nocaseglob
          if [ "${#fake[@]}" -gt 0 ]; then
            echo "СТОП: код фейкового сервера просочился в состав релиза" >&2
            exit 1
          fi

      - name: Контрольные суммы
        run: cd dist && sha256sum amnezia-admin-* > SHA256SUMS

      - name: Субъекты аттестации
        # Порядок шагов не менять: суммы снимаются после проверки состава,
        # аттестация — после сумм. Здесь раскрывается ТО ЖЕ множество
        # ATTEST_SUBJECTS, что уходит в attest-build-provenance ниже: девять
        # имён, среди них SHA256SUMS, и каждый файл dist/ — субъект.
        # Каждый шаблон обязан найти хотя бы один файл: пустой шаблон —
        # это подпись, которой нет, а не «подписывать нечего».
        run: |
          set -euo pipefail
          shopt -s nullglob
          subjects=()
          while IFS= read -r pat; do
            test -n "$pat" || continue
            # shellcheck disable=SC2206 # глоб раскрывается намеренно
            found=($pat)
            test "${#found[@]}" -gt 0 || { echo "СТОП: шаблон субъектов '$pat' не нашёл ни одного файла" >&2; exit 1; }
            # Имя без глоб-символов nullglob не трогает: bash оставляет его
            # как есть, даже если файла нет. Поэтому существование — отдельно.
            for f in "${found[@]}"; do
              test -f "$f" || { echo "СТОП: субъект аттестации '$f' (шаблон '$pat') — нет такого файла" >&2; exit 1; }
            done
            subjects+=("${found[@]}")
          done <<< "$ATTEST_SUBJECTS"
          printf 'субъект: %s\n' "${subjects[@]}"
          uniq_count="$(printf '%s\n' "${subjects[@]}" | sort -u | wc -l)"
          test "${#subjects[@]}" -eq "$uniq_count" || { echo "СТОП: субъекты аттестации повторяются" >&2; exit 1; }
          test "${#subjects[@]}" -eq 9 || { echo "СТОП: субъектов аттестации ${#subjects[@]}, ожидалось 9 (8 бинарей + SHA256SUMS)" >&2; exit 1; }
          printf '%s\n' "${subjects[@]}" | grep -qx 'dist/SHA256SUMS' || { echo "СТОП: SHA256SUMS не входит в субъекты аттестации — файл сумм уйдёт без подписи" >&2; exit 1; }
          all=(dist/*)
          for f in "${all[@]}"; do
            printf '%s\n' "${subjects[@]}" | grep -qxF -- "$f" || { echo "СТОП: $f публикуется, но не входит в субъекты аттестации" >&2; exit 1; }
          done

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.ATTEST_SUBJECTS }}

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rc') }}
